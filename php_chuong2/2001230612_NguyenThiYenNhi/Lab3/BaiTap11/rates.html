<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>Tỷ giá ngoại tệ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Tỷ giá ngoại tệ</h1>

    <div class="controls">
      <label>Đồng tiền gốc:
        <select id="base">
          <option>USD</option>
          <option>EUR</option>
          <option>VND</option>
          <option>JPY</option>
          <option>GBP</option>
        </select>
      </label>
      <button id="btnRefresh">Làm mới</button>
      <div class="meta" id="metaText">Tự động cập nhật mỗi 10 phút</div>
    </div>

    <div id="update" class="meta"></div>
    <div id="error" class="error"></div>

    <table aria-label="Tỷ giá">
      <thead>
        <tr>
          <th>Mã</th>
          <th style="text-align:right">1 <span id="baseLabel">USD</span> =</th>
          <th>Ghi chú</th>
        </tr>
      </thead>
      <tbody id="ratesBody"></tbody>
    </table>
  </div>

  <script>
    const popular = ["USD","EUR","VND","JPY","GBP","AUD","CAD","CHF","CNY","SGD"];
    const baseEl = document.getElementById('base');
    const baseLabel = document.getElementById('baseLabel');
    const btn = document.getElementById('btnRefresh');
    const updateEl = document.getElementById('update');
    const errorEl = document.getElementById('error');
    const ratesBody = document.getElementById('ratesBody');
    const REFRESH_MS = 10 * 60 * 1000;

    async function loadRates() {
      const base = baseEl.value.trim() || 'USD';
      baseLabel.textContent = base;
      errorEl.textContent = '';
      updateEl.textContent = '';
      ratesBody.innerHTML = '';

      try {
        btn.disabled = true;
        btn.textContent = 'Đang tải...';

        const res = await fetch('get_rates.php?base=' + encodeURIComponent(base));
        const data = await res.json();

        if (!data.ok) {
          errorEl.textContent = data.error || 'Lỗi khi lấy dữ liệu';
          if (data.detail) {
            errorEl.textContent += ' — chi tiết: ' + data.detail.split('\n')[0];
          }
          btn.disabled = false;
          btn.textContent = 'Làm mới';
          return;
        }

        if (data.date) {
          updateEl.textContent = 'Cập nhật: ' + data.date + (data.source ? ' (nguồn: ' + data.source + ')' : '');
        } else if (data.timestamp) {
          updateEl.textContent = 'Cập nhật: ' + new Date(data.timestamp * 1000).toLocaleString();
        }

        for (const code of popular) {
          const r = data.rates && data.rates[code];
          const rateText = (typeof r === 'number') ? r.toFixed(4) : (r ? r : '-');
          const note = r ? `1 ${data.base} = ${rateText} ${code}` : '';
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${code}</td>
                          <td class="rate">${rateText}</td>
                          <td>${note}</td>`;
          ratesBody.appendChild(tr);
        }
      } catch (e) {
        errorEl.textContent = 'Lỗi: ' + (e.message || e);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Làm mới';
      }
    }

    btn.addEventListener('click', loadRates);
    baseEl.addEventListener('change', loadRates);

    loadRates();
    setInterval(loadRates, REFRESH_MS);
  </script>
</body>
</html>
